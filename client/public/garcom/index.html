<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>João Caiçara - Garçom</title>
<link rel="manifest" href="/garcom/manifest.json">
<meta name="theme-color" content="#0F4C5C">
<style>
:root{--p:#0F4C5C;--a:#D95D39;--ok:#2A9D8F;--bg:#F7F4EC;--card:#fff;--line:#ddd6c7;--txt:#173d45}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input{font:inherit}.header{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--a)}.header img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px}.header h1{font-size:1.05rem;margin:0;flex:1}.status{border:0;border-radius:999px;padding:7px 10px;background:#ffffff20;color:#fff;font-size:.72rem}.back{border:0;border-radius:8px;padding:9px 11px;background:#d8b07a;font-weight:bold;display:none}.wrap{padding:14px}.section{font-size:.78rem;font-weight:900;letter-spacing:.12em;margin:16px 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mesa{min-height:105px;border:2px solid #caa875;border-radius:16px;background:#e5c18d;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:center}.mesa.aberta{background:var(--p);color:#fff;border-color:#083b44}.mesa.nova{background:var(--a);border-color:#a43e24;color:#fff}.mesa small{font-size:.68rem;font-weight:bold;opacity:.8;text-transform:uppercase;letter-spacing:.08em}.mesa strong{font-size:1.8rem}.mesa span{font-size:.72rem;margin-top:4px}.pedido{display:none}.cliente,.busca{width:100%;padding:12px;border:1px solid var(--line);background:#fff}.tabs{display:flex;gap:6px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;white-space:nowrap}.tab.active{background:var(--p);color:#fff}.produtos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 12px 190px}.produto{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;text-align:left;min-height:95px}.produto b{display:block}.produto em{display:block;color:var(--ok);font-style:normal;font-weight:bold;margin-top:8px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--a);z-index:30}.resumo{padding:10px 12px;background:var(--a);color:#fff;font-weight:bold;text-align:center}.itens{max-height:32vh;overflow:auto;display:none}.linha{display:flex;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)}.linha .nome{flex:1}.q{display:flex;align-items:center;gap:5px}.q button{width:30px;height:30px;border:0;border-radius:50%;background:var(--p);color:#fff}.acoes{display:flex;gap:7px;padding:8px}.acoes button{flex:1;border:0;border-radius:9px;padding:12px 6px;color:#fff;font-weight:bold}.limpar{background:#b94d3c}.enviar{background:#457B9D}.fechar{background:var(--ok)}.vazio{text-align:center;color:#777;padding:25px;grid-column:1/-1}@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.produtos{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="header"><img src="/tradicao-caicara-logo.webp" alt="Logo"><h1 id="titulo">Selecione a mesa</h1><button id="status" class="status">conectando...</button><button id="voltar" class="back" onclick="voltar()">← Mesas</button></header>
<section id="mesasTela" class="wrap"><div class="section">SALÃO · 1 A 25</div><div id="salao" class="grid"></div><div class="section">DECK / PRAIA · 50 A 65</div><div id="deck" class="grid"></div></section>
<section id="pedidoTela" class="pedido"><input id="cliente" class="cliente" placeholder="Nome do cliente (opcional)"><input id="busca" class="busca" placeholder="🔎 Buscar item..."><div id="tabs" class="tabs"></div><div id="produtos" class="produtos"></div><div class="bottom"><div id="resumo" class="resumo" onclick="toggleItens()">Comanda · 0 itens · R$ 0,00</div><div id="itens" class="itens"></div><div class="acoes"><button class="limpar" onclick="limpar()">Limpar</button><button id="enviar" class="enviar" onclick="enviar()">Enviar</button><button class="fechar" onclick="fecharConta()">Fechar</button></div></div></section>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyB7hHYHFZ3L-z-sPmgKbJI75eaWHlSGI3A",authDomain:"joaocaicaratradicao.firebaseapp.com",databaseURL:"https://joaocaicaratradicao-default-rtdb.firebaseio.com",projectId:"joaocaicaratradicao",storageBucket:"joaocaicaratradicao.firebasestorage.app",messagingSenderId:"777982220663",appId:"1:777982220663:web:0af4e9bcbaaec847122972"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();let authOK=false,conectado=false;firebase.auth().signInAnonymously().catch(console.error);firebase.auth().onAuthStateChanged(u=>{authOK=!!u;status()});db.ref('.info/connected').on('value',s=>{conectado=!!s.val();status()});function status(){const e=document.getElementById('status');e.textContent=authOK&&conectado?'🟢 online':navigator.onLine?'🟠 conectando':'🔴 offline'}
const cats=[['favoritos','⭐ Favoritos'],['todos','Todos'],['aperitivos','Aperitivos'],['saladas','Saladas'],['peixe_epoca','Peixe da Época'],['file_badejo','Filé de Badejo'],['salmao','Salmão'],['peixes_camaroes','Peixes e Camarões'],['massas_risotos','Massas/Risotos'],['carnes','Carnes'],['frango','Frango'],['acompanhamentos','Acompanhamentos'],['cervejas','Cervejas'],['caipirinhas','Drinks'],['destilados','Destilados'],['aguas_refrigerantes','Águas/Refrigerantes'],['sucos','Sucos']];
let produtos=[],mesas={},mesa=null,categoria='favoritos',itensAbertos=false;const moeda=v=>`R$ ${Number(v||0).toFixed(2).replace('.',',')}`;const vazia=()=>({itens:[],cliente:'',abertura:null,origemAbertura:null});function norm(m){m=m&&typeof m==='object'?m:{};let itens=Array.isArray(m.itens)?m.itens:(m.itens&&typeof m.itens==='object'?Object.values(m.itens):[]);return {...m,itens:itens.filter(Boolean),cliente:typeof m.cliente==='string'?m.cliente:'',abertura:m.abertura||null,origemAbertura:m.origemAbertura||null}}
db.ref('cardapio').on('value',s=>{const v=s.val();produtos=Array.isArray(v)?v.filter(Boolean):(v?Object.values(v).filter(Boolean):[]);renderProdutos()});db.ref('mesas').on('value',s=>{const v=s.val()||{};mesas={};Object.keys(v).forEach(k=>mesas[k]=norm(v[k]));renderMesas();if(mesa&&mesas[mesa]){renderComanda();if(document.activeElement!==document.getElementById('cliente'))document.getElementById('cliente').value=mesas[mesa].cliente||''}});
function mesaAberta(m){return !!(m&&(m.abertura||m.itens?.length))}function renderMesas(){const salao=document.getElementById('salao'),deck=document.getElementById('deck');salao.innerHTML='';deck.innerHTML='';const add=(n,alvo)=>{const m=norm(mesas[n]||vazia()),aberta=mesaAberta(m),nova=m.itens.some(i=>i&&i.enviado===false&&i.rascunho!==true),tot=m.itens.reduce((a,i)=>a+(Number(i.preco)||0)*(Number(i.qtd)||0),0);alvo.insertAdjacentHTML('beforeend',`<button class="mesa ${aberta?'aberta':''} ${nova?'nova':''}" onclick="abrirMesa(${n})"><small>${nova?'pedido novo':aberta?'aberta':'livre'}</small><strong>${n}</strong><span>${aberta?(m.itens.length?`${m.itens.length} item(ns) · ${moeda(tot)}`:'Comanda aberta'):'Toque para abrir'}</span></button>`)};for(let i=1;i<=25;i++)add(i,salao);for(let i=50;i<=65;i++)add(i,deck)}
async function abrirMesa(n){mesa=n;let atual=norm(mesas[n]||vazia());const precisaAbrir=!atual.abertura;if(precisaAbrir){atual={...atual,abertura:Date.now(),origemAbertura:'garcom'};mesas[n]=atual;try{await db.ref(`mesas/${n}`).set(atual);db.ref('auditoria').push({acao:'abrir_mesa',origem:'garcom',funcionario:'livre',detalhes:{mesa:n},criadoEm:Date.now()})}catch(e){console.error(e);alert('Não foi possível abrir a mesa no servidor. Verifique a conexão.');mesa=null;return}}else mesas[n]=atual;document.getElementById('mesasTela').style.display='none';document.getElementById('pedidoTela').style.display='block';document.getElementById('voltar').style.display='inline-block';document.getElementById('titulo').textContent=`Mesa ${n}`;document.getElementById('cliente').value=atual.cliente||'';renderTabs();renderProdutos();renderComanda()}
function voltar(){mesa=null;document.getElementById('mesasTela').style.display='block';document.getElementById('pedidoTela').style.display='none';document.getElementById('voltar').style.display='none';document.getElementById('titulo').textContent='Selecione a mesa'}
async function salvarMesa(){if(!mesa||!mesas[mesa])return;return db.ref(`mesas/${mesa}`).set(mesas[mesa])}document.getElementById('cliente').addEventListener('input',e=>{if(!mesa)return;mesas[mesa].cliente=e.target.value;salvarMesa().catch(console.error)});document.getElementById('busca').addEventListener('input',renderProdutos);
function renderTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${categoria===c[0]?'active':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join('')}function setCat(c){categoria=c;document.getElementById('busca').value='';renderTabs();renderProdutos()}function renderProdutos(){const g=document.getElementById('produtos');if(!g)return;const termo=document.getElementById('busca')?.value.trim().toLowerCase()||'';let arr=produtos.filter(p=>p&&p.ativo!==false);if(termo)arr=arr.filter(p=>String(p.nome||'').toLowerCase().includes(termo));else if(categoria==='favoritos')arr=arr.filter(p=>p.favorito);else if(categoria!=='todos')arr=arr.filter(p=>p.categoria===categoria);g.innerHTML=arr.length?arr.map(p=>`<button class="produto" onclick="add(${Number(p.id)})"><b>${p.nome}</b><em>${moeda(p.preco)}</em></button>`).join(''):'<div class="vazio">Nenhum item encontrado.</div>'}
async function add(id){if(!mesa)return;const p=produtos.find(x=>Number(x.id)===Number(id));if(!p)return;const m=mesas[mesa]||vazia();if(!m.abertura)m.abertura=Date.now();const igual=m.itens.find(i=>Number(i.id)===Number(id)&&Number(i.preco)===Number(p.preco)&&!i.obs&&i.enviado===false&&i.rascunho===true);if(igual)igual.qtd=(Number(igual.qtd)||0)+1;else m.itens.push({...p,qtd:1,obs:'',enviado:false,rascunho:true,origem:'garcom'});mesas[mesa]=m;renderComanda();renderMesas();try{await salvarMesa()}catch(e){console.error(e);alert('Falha ao sincronizar o item. Ele continua visível neste aparelho, mas confirme a conexão.') }}
function renderComanda(){if(!mesa||!mesas[mesa])return;const m=mesas[mesa],box=document.getElementById('itens');let qtd=0,total=0;box.innerHTML=m.itens.length?m.itens.map((i,idx)=>{qtd+=Number(i.qtd)||0;total+=(Number(i.preco)||0)*(Number(i.qtd)||0);return `<div class="linha"><div class="nome"><b>${i.qtd}x ${i.nome}</b><div>${i.enviado?'✅ enviado':i.rascunho?'📝 no caixa / aguardando envio':'🆕 novo'}</div></div><div class="q"><button onclick="qtdItem(${idx},-1)">-</button><span>${i.qtd}</span><button onclick="qtdItem(${idx},1)">+</button></div></div>`}).join(''):'<div class="vazio">Comanda aberta, sem itens.</div>';document.getElementById('resumo').textContent=`Comanda · ${qtd} item(ns) · ${moeda(total)}`;const pend=m.itens.filter(i=>i.enviado===false);document.getElementById('enviar').textContent=pend.length?`Enviar ${pend.length}`:'Tudo enviado'}function toggleItens(){itensAbertos=!itensAbertos;document.getElementById('itens').style.display=itensAbertos?'block':'none'}
async function qtdItem(idx,d){if(!mesa)return;const m=mesas[mesa],i=m.itens[idx];if(!i)return;i.qtd=(Number(i.qtd)||0)+d;if(i.qtd<=0)m.itens.splice(idx,1);renderComanda();renderMesas();await salvarMesa().catch(console.error)}
async function limpar(){if(!mesa||!confirm(`Limpar a comanda da Mesa ${mesa}?`))return;mesas[mesa]={itens:[],cliente:'',abertura:null,origemAbertura:null};document.getElementById('cliente').value='';await salvarMesa().catch(console.error);db.ref('auditoria').push({acao:'limpar_comanda',origem:'garcom',funcionario:'livre',detalhes:{mesa},criadoEm:Date.now()});renderComanda();renderMesas()}
async function enviar(){if(!mesa||!authOK)return alert('Aguarde a conexão com o Firebase.');const m=mesas[mesa],novos=m.itens.filter(i=>i.enviado===false);if(!novos.length)return alert('Não há itens novos para enviar.');const agora=Date.now(),envioId=`envio_${agora}_${Math.random().toString(36).slice(2,8)}`;const grupos={cozinha:[],bar:[]};novos.forEach(i=>{i.envioId=envioId;(i.setor==='bar'?grupos.bar:grupos.cozinha).push(i)});try{for(const setor of ['cozinha','bar'])if(grupos[setor].length)await db.ref('pedidosProducao').push({mesa,cliente:m.cliente||'',setor,itens:JSON.parse(JSON.stringify(grupos[setor])),status:'recebido',origem:'garcom',criadoEm:agora,atualizadoEm:agora});novos.forEach(i=>{i.enviado=true;i.rascunho=false});await salvarMesa();db.ref('auditoria').push({acao:'enviar_producao',origem:'garcom',funcionario:'livre',detalhes:{mesa,quantidade:novos.length},criadoEm:Date.now()});renderComanda();renderMesas();alert('Pedido enviado para produção.') }catch(e){console.error(e);alert('Falha no envio. Os itens foram mantidos na comanda para nova tentativa.') }}
async function fecharConta(){if(!mesa)return;const m=mesas[mesa],subtotal=m.itens.reduce((a,i)=>a+(Number(i.preco)||0)*(Number(i.qtd)||0),0);if(subtotal<=0)return alert('A comanda está vazia.');const forma=prompt('Forma de pagamento: pix, dinheiro, credito ou debito','pix');if(!forma)return;const f=forma.toLowerCase().trim();if(!['pix','dinheiro','credito','debito'].includes(f))return alert('Forma de pagamento inválida.');if(!confirm(`Fechar Mesa ${mesa} por ${moeda(subtotal)} em ${f}?`))return;const venda={id:`garcom-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,mesa,cliente:m.cliente||'Não informado',itens:JSON.parse(JSON.stringify(m.itens)),subtotal,taxa:0,total:subtotal,pagamentos:{dinheiro:f==='dinheiro'?subtotal:0,pix:f==='pix'?subtotal:0,credito:f==='credito'?subtotal:0,debito:f==='debito'?subtotal:0},troco:0,dataHora:new Date().toLocaleString('pt-BR'),criadoEm:Date.now(),origem:'garcom'};try{await db.ref('vendas').push(venda);mesas[mesa]={itens:[],cliente:'',abertura:null,origemAbertura:null};await salvarMesa();db.ref('auditoria').push({acao:'fechar_conta',origem:'garcom',funcionario:'livre',detalhes:{mesa,total:subtotal},criadoEm:Date.now()});alert('Conta fechada com sucesso.');voltar()}catch(e){console.error(e);alert('Não foi possível fechar a conta. Tente novamente.') }}
renderMesas();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/garcom/service-worker.js',{scope:'/garcom/'}));
</script>
</body></html>

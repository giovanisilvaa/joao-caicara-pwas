name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/777982220663/locations/global/workloadIdentityPools/github-actions-jo-o-cai-ara/providers/github
          service_account: firebase-adminsdk-fbsvc@joaocaicaratradicao.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Enable Firebase email/password sign-in
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "X-Goog-User-Project: joaocaicaratradicao" \
            -H "Content-Type: application/json" \
            -d '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}' \
            'https://identitytoolkit.googleapis.com/admin/v2/projects/joaocaicaratradicao/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired'

      - name: Seed administrator access profile
        run: |
          npx firebase-tools@latest database:set /perfisAcesso/woAmR3x91JcMZGLzykBUtLG97Hx1 --data '{"perfil":"administrador"}' --instance joaocaicaratradicao-default-rtdb --project joaocaicaratradicao --force --non-interactive
          npx firebase-tools@latest database:set /perfisAcesso/2SMlsyBIW8P0bHZgcvx32XDFb793 --data '{"perfil":"administrador"}' --instance joaocaicaratradicao-default-rtdb --project joaocaicaratradicao --force --non-interactive

      - name: Verify administrator access profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_JSON="$(npx firebase-tools@latest database:get /perfisAcesso/2SMlsyBIW8P0bHZgcvx32XDFb793 --instance joaocaicaratradicao-default-rtdb --project joaocaicaratradicao --non-interactive)"
          echo "Perfil administrativo lido do Firebase: ${PROFILE_JSON}"
          PROFILE_JSON="$PROFILE_JSON" node - <<'NODE'
          const raw = process.env.PROFILE_JSON || '';
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.perfil !== 'administrador') {
            console.error('Perfil administrativo não foi persistido corretamente no Firebase.');
            process.exit(1);
          }
          console.log('Perfil administrativo confirmado no Firebase.');
          NODE

      - name: Seed Sushi menu safely
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL='https://joaocaicaratradicao-default-rtdb.firebaseio.com/cardapio.json'
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          ATUAL="$(mktemp)"
          CABECALHOS="$(mktemp)"
          ATUALIZADO="$(mktemp)"
          VERIFICACAO="$(mktemp)"
          trap 'rm -f "$ATUAL" "$CABECALHOS" "$ATUALIZADO" "$VERIFICACAO"' EXIT

          curl --fail-with-body --silent --show-error \
            --dump-header "$CABECALHOS" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'X-Firebase-ETag: true' \
            "$DATABASE_URL" \
            -o "$ATUAL"

          ETAG="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub("\r",""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$CABECALHOS")"
          if [ -z "$ETAG" ]; then
            echo '::error::Firebase não retornou ETag para /cardapio; atualização Sushi abortada sem escrita.'
            exit 1
          fi

          node scripts/sushi-cardapio-update.mjs "$ATUAL" > "$ATUALIZADO"

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "If-Match: ${ETAG}" \
            -H 'Content-Type: application/json' \
            --data-binary @"$ATUALIZADO" \
            "$DATABASE_URL" \
            -o /dev/null

          npx firebase-tools@latest database:get /cardapio \
            --instance joaocaicaratradicao-default-rtdb \
            --project joaocaicaratradicao \
            --non-interactive > "$VERIFICACAO"
          node scripts/sushi-cardapio-update.mjs "$VERIFICACAO" --validate-only
          echo 'Cardápio Sushi persistido e validado no Firebase sem alterar mesas, pedidos ou vendas.'

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project joaocaicaratradicao --non-interactive

      - name: Verify PWA deployment propagation
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://joaocaicaratradicao.web.app"

          verificar_arquivo() {
            local caminho="$1"
            local arquivo="$2"
            local temporario
            temporario="$(mktemp)"

            for tentativa in $(seq 1 12); do
              if curl --fail --silent --show-error \
                -H 'Cache-Control: no-cache' \
                "${BASE_URL}${caminho}?verify=${GITHUB_SHA}-${tentativa}" \
                -o "$temporario" && cmp -s "$arquivo" "$temporario"; then
                echo "Publicado e conferido: ${caminho}"
                rm -f "$temporario"
                return 0
              fi
              echo "Aguardando propagação de ${caminho} (tentativa ${tentativa}/12)..."
              sleep 5
            done

            echo "::error::O Firebase Hosting não está servindo a versão esperada de ${caminho}."
            diff -u "$arquivo" "$temporario" || true
            rm -f "$temporario"
            return 1
          }

          verificar_no_cache() {
            local caminho="$1"
            local cabecalhos

            for tentativa in $(seq 1 12); do
              cabecalhos="$(curl --fail --silent --show-error --head \
                -H 'Cache-Control: no-cache' \
                "${BASE_URL}${caminho}?headers=${GITHUB_SHA}-${tentativa}" || true)"
              if printf '%s\n' "$cabecalhos" | grep -qi '^cache-control:.*no-store'; then
                echo "Cache-Control confirmado: ${caminho}"
                return 0
              fi
              echo "Aguardando Cache-Control de ${caminho} (tentativa ${tentativa}/12)..."
              sleep 5
            done

            echo "::error::Cabeçalho no-store não confirmado em ${caminho}."
            printf '%s\n' "$cabecalhos"
            return 1
          }

          verificar_arquivo '/pdv/service-worker.js' 'client/public/pdv/service-worker.js'
          verificar_arquivo '/garcom/service-worker.js' 'client/public/garcom/service-worker.js'
          verificar_arquivo '/pwa-live-update.js' 'client/public/pwa-live-update.js'
          verificar_arquivo '/pdv/modern-hybrid.css' 'client/public/pdv/modern-hybrid.css'
          verificar_arquivo '/garcom/waiter-speed.css' 'client/public/garcom/waiter-speed.css'
          verificar_arquivo '/menu-20260828.js' 'client/public/menu-20260828.js'
          verificar_arquivo '/menu-sushi-20260903.js' 'client/public/menu-sushi-20260903.js'
          verificar_arquivo '/sushi-menu-20260903.json' 'client/public/sushi-menu-20260903.json'
          verificar_arquivo '/menu-salad-half.js' 'client/public/menu-salad-half.js'
          verificar_arquivo '/item-cancellation-v2.js' 'client/public/item-cancellation-v2.js'
          verificar_arquivo '/pdv/pdv-cancellation-print.js' 'client/public/pdv/pdv-cancellation-print.js'
          verificar_arquivo '/staged-checkout-v1.js' 'client/public/staged-checkout-v1.js'
          verificar_arquivo '/garcom/restricoes-operacionais.js' 'client/public/garcom/restricoes-operacionais.js'
          verificar_arquivo '/pdv/pdv-item-transfer.js' 'client/public/pdv/pdv-item-transfer.js'
          verificar_arquivo '/pdv/report-dashboard-v1.js' 'client/public/pdv/report-dashboard-v1.js'
          verificar_arquivo '/pdv/' 'client/public/pdv/index.html'
          verificar_arquivo '/garcom/' 'client/public/garcom/index.html'

          verificar_no_cache '/pdv/service-worker.js'
          verificar_no_cache '/garcom/service-worker.js'
          verificar_no_cache '/pwa-live-update.js'
          verificar_no_cache '/pdv/'
          verificar_no_cache '/garcom/'

      - name: Deploy Realtime Database rules
        run: npx firebase-tools@latest deploy --only database --project joaocaicaratradicao --non-interactive
